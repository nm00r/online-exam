<a
  routerLink="/auth/forgot-password"
  aria-label="Back to forgot password"
  class="inline-flex items-center justify-center w-9 h-9 border border-border rounded-[2px] text-heading hover:bg-gray-50 transition-colors mb-8"
>
  <lucide-icon [img]="ArrowLeft" [size]="16" [strokeWidth]="2"></lucide-icon>
</a>

<h2 class="font-sans text-[30px] font-bold text-heading mb-4">Password Reset Sent</h2>

<div class="flex flex-col gap-4 text-[14px] leading-relaxed font-mono mb-8">
  <p class="text-heading">
    We have sent a password reset link to:<br />
    <span class="text-primary">{{ email }}</span><span class="text-heading">.</span>
  </p>

  <p class="text-heading">
    Please check your inbox and follow the instructions to reset your password.
  </p>

  <p class="text-subtext text-[13px]">
    If you don't see the email within a few minutes, check your spam or junk folder.
  </p>
</div>

<p class="text-center text-[14px] leading-none font-medium text-subtext font-mono">
  Don't have an account?
  <a routerLink="/auth/register" class="text-primary hover:underline ml-1">Create yours</a>
</p>
