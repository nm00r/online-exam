<h2 class="font-sans text-[30px] font-bold text-heading mb-2">Forgot Password</h2>
<p class="text-[14px] leading-relaxed font-normal text-subtext font-mono mb-6">
  Don't worry, we will help you recover your account.
</p>

<form [formGroup]="form" (ngSubmit)="onNext()" novalidate class="flex flex-col gap-4">
  <div>
    <label for="forgot-email" class="field-label">Email</label>
    <input
      id="forgot-email"
      type="email"
      formControlName="email"
      placeholder="user@example.com"
      autocomplete="email"
      [class]="'input-field ' + (submitted() && email.invalid ? 'error' : '')"
    />
    @if (submitted() && email.errors?.['required']) {
      <p class="field-error">Email is required</p>
    }
    @if (submitted() && email.errors?.['email']) {
      <p class="field-error">Please enter a valid email</p>
    }
  </div>

  <app-alert [message]="error() ?? ''"></app-alert>

  <button type="submit" [disabled]="loading()" class="btn-primary mt-2 disabled:opacity-60">
    <span>{{ loading() ? 'Sending...' : 'Next' }}</span>
    <lucide-icon [img]="ChevronRight" [size]="16" [strokeWidth]="2"></lucide-icon>
  </button>

  <p class="text-center text-[14px] leading-none font-medium text-subtext font-mono mt-2">
    Don't have an account?
    <a routerLink="/auth/register" class="text-primary hover:underline ml-1">Create yours</a>
  </p>
</form>
