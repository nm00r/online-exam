<h2 class="font-sans text-[30px] font-bold text-heading mb-2">Create a New Password</h2>
<p class="text-[14px] leading-relaxed font-normal text-subtext font-mono mb-6">
  Create a new strong password for your account.
</p>

<form [formGroup]="form" (ngSubmit)="onSubmit()" novalidate class="flex flex-col gap-4">
  <app-password-input formControlName="password" label="New Password" inputId="new-password" autocomplete="new-password"
    [hasError]="submitted() && password.invalid"
    [errorMsg]="password.errors?.['required'] ? 'Password is required' : password.errors?.['minlength'] ? 'At least 8 characters' : ''"></app-password-input>

  <app-password-input formControlName="confirmPassword" label="Confirm New Password" inputId="confirm-new-password"
    autocomplete="new-password" [hasError]="submitted() && (confirmPassword.invalid || !!form.errors?.['mismatch'])"
    [errorMsg]="confirmPassword.errors?.['required'] ? 'Please confirm your password' : form.errors?.['mismatch'] ? 'Passwords do not match' : ''"></app-password-input>

  <app-alert [message]="error() ?? ''"></app-alert>

  <button type="submit" [disabled]="loading()" class="btn-primary mt-2 disabled:opacity-60">
    {{ loading() ? 'Resetting...' : 'Reset Password' }}
  </button>

  <p class="text-center text-[14px] leading-none font-medium text-subtext font-mono mt-2">
    Don't have an account?
    <a routerLink="/auth/register" class="text-primary hover:underline ml-1">Create yours</a>
  </p>
</form>
