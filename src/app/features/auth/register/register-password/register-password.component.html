<app-stepper [total]="4" [current]="3"></app-stepper>

<h2 class="font-sans text-[30px] font-bold text-heading mb-1">Create Account</h2>
<p class="text-primary text-[20px] font-semibold font-mono mb-6">Create a strong password</p>

<form [formGroup]="form" (ngSubmit)="onSubmit()" novalidate class="flex flex-col gap-4">
  <app-password-input
    formControlName="password"
    label="Password"
    inputId="password"
    [required]="true"
    autocomplete="new-password"
    [hasError]="submitted() && password.invalid"
    [errorMsg]="password.errors?.['required'] ? 'Password is required' : password.errors?.['minlength'] ? 'At least 8 characters' : ''"
  ></app-password-input>

  <app-password-input
    formControlName="confirmPassword"
    label="Confirm Password"
    inputId="confirmPassword"
    [required]="true"
    autocomplete="new-password"
    [hasError]="submitted() && (confirmPassword.invalid || !!form.errors?.['mismatch'])"
    [errorMsg]="confirmPassword.errors?.['required'] ? 'Please confirm your password' : form.errors?.['mismatch'] ? 'Passwords do not match' : ''"
  ></app-password-input>

  <app-alert [message]="error() ?? ''"></app-alert>

  <button type="submit" [disabled]="loading()" class="btn-primary mt-2 disabled:opacity-60">
    {{ loading() ? 'Creating Account...' : 'Create Account' }}
  </button>
</form>
