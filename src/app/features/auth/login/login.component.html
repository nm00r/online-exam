<h2 class="font-sans text-[30px] font-bold text-heading mb-6">Login</h2>

<form [formGroup]="form" (ngSubmit)="onSubmit()" novalidate class="flex flex-col gap-4">
  <div>
    <label for="username" class="field-label">Username</label>
    <input
      id="username"
      type="text"
      formControlName="username"
      placeholder="user123"
      autocomplete="username"
      [class]="'input-field ' + (submitted() && username.invalid ? 'error' : '')"
    />
    @if (submitted() && username.errors?.['required']) {
      <p class="field-error">Your username is required</p>
    }
  </div>

  <div>
    <app-password-input
      formControlName="password"
      label="Password"
      inputId="password"
      placeholder="••••••••"
      autocomplete="current-password"
      [hasError]="submitted() && password.invalid"
      errorMsg="Your password is required"
    ></app-password-input>

    <div class="flex justify-end mt-2">
      <a routerLink="/auth/forgot-password" class="text-[14px] leading-none font-medium text-primary font-mono hover:underline">
        Forgot your password?
      </a>
    </div>
  </div>

  <app-alert [message]="error() ?? ''"></app-alert>

  <button type="submit" [disabled]="loading()" class="btn-primary disabled:opacity-60">
    {{ loading() ? 'Logging in...' : 'Login' }}
  </button>

  <p class="text-center text-[14px] leading-none font-medium text-subtext font-mono">
    Don't have an account?
    <a routerLink="/auth/register" class="text-primary hover:underline ml-1">Create yours</a>
  </p>
</form>
