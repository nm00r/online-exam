@if (message) {
  <div
    role="alert"
    class="relative flex items-center justify-center border border-error bg-[#FEF2F2] text-error rounded-[2px] px-4 py-3 text-[14px] leading-none font-mono"
  >
    <span class="absolute -top-2.5 left-1/2 -translate-x-1/2 bg-white rounded-full text-error">
      <lucide-icon [img]="XCircle" [size]="18" [strokeWidth]="2"></lucide-icon>
    </span>
    <span>{{ message }}</span>
  </div>
}
