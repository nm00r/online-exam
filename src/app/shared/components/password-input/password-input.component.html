<div>
  @if (label) {
    <label [for]="inputId" class="field-label">
      {{ label }}@if (required) {<span class="text-error ml-0.5">*</span>}
    </label>
  }
  <div class="relative">
    <input
      [id]="inputId"
      [type]="show ? 'text' : 'password'"
      [placeholder]="placeholder"
      [value]="value"
      (input)="onInput($event)"
      (blur)="onTouched()"
      [class]="'input-field pr-10 ' + (hasError ? 'error' : '')"
      [attr.autocomplete]="autocomplete"
    />
    <button
      type="button"
      (click)="toggle()"
      class="absolute right-3 top-1/2 -translate-y-1/2 text-[#9CA3AF] hover:text-heading cursor-pointer"
      aria-label="Toggle password visibility"
    >
      <lucide-icon [img]="show ? EyeOff : Eye" [size]="18" [strokeWidth]="1.75"></lucide-icon>
    </button>
  </div>
  @if (hasError && errorMsg) {
    <p class="field-error">{{ errorMsg }}</p>
  }
</div>
